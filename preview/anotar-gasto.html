<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vero - Preview: Anotar Gasto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
</head>
<body>

  <nav class="preview-nav-bar">
    <div class="preview-nav-links">
      <a href="index.html">Vero</a>
      <a href="login.html">Login</a>
      <a href="inicio.html">Página Inicial</a>
      <a href="anotar-gasto.html" class="active" aria-current="page">Anotar</a>
    </div>
    <button type="button" class="menu-btn" aria-label="Abrir menu de telas" aria-expanded="false" aria-controls="menu-telas">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Menu lateral com todas as telas -->
  <div class="menu-fundo" hidden></div>
  <aside id="menu-telas" class="menu-lateral" aria-hidden="true" aria-label="Telas do aplicativo">
    <div class="menu-topo">
      <strong>Telas</strong>
      <button type="button" class="menu-fechar" aria-label="Fechar menu">
        <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="menu-links">
      <a href="index.html">Vero</a>
      <a href="login.html">Login</a>
      <a href="inicio.html">Página Inicial</a>
      <a href="anotar-gasto.html" class="active" aria-current="page">Anotar</a>
    </div>
  </aside>

  <div class="page-container">
    <header class="navbar">
      <a href="inicio.html" class="brand-logo">
        <svg class="icon" viewBox="0 0 36 36" style="width:34px; height:34px; stroke-width:5; stroke:var(--violeta-vero);"><path d="M6 18.5L14.5 27L30 9.5"/></svg>
        <span>Vero</span>
      </a>
      <a href="inicio.html" class="navbar-btn btn-lilas btn-borda-preta">Cancelar</a>
    </header>

    <div class="card-formulario vero-card">
      <h1 id="titulo-anotar" class="titulo-tela">Anotar novo gasto</h1>

      <!-- Tipo de lançamento -->
      <div class="tipo-grid" role="group" aria-label="O que você quer anotar?">
        <button type="button" class="tipo-btn active" aria-pressed="true" onclick="escolherTipo('gasto', this)">Gasto</button>
        <button type="button" class="tipo-btn" aria-pressed="false" onclick="escolherTipo('entrada', this)">Entrada</button>
      </div>

      <p class="subtitulo-tela">Digite o valor no teclado abaixo:</p>

      <!-- Display Monetário -->
      <div id="display-valor" class="display-monetario">
        R$ 12,50
      </div>

      <!-- Teclado Numérico 64px Anti-Vazamento -->
      <div class="keypad-grid">
        <button type="button" class="key-btn" onclick="digitar('1')">1</button>
        <button type="button" class="key-btn" onclick="digitar('2')">2</button>
        <button type="button" class="key-btn" onclick="digitar('3')">3</button>
        <button type="button" class="key-btn" onclick="digitar('4')">4</button>
        <button type="button" class="key-btn" onclick="digitar('5')">5</button>
        <button type="button" class="key-btn" onclick="digitar('6')">6</button>
        <button type="button" class="key-btn" onclick="digitar('7')">7</button>
        <button type="button" class="key-btn" onclick="digitar('8')">8</button>
        <button type="button" class="key-btn" onclick="digitar('9')">9</button>
        <button type="button" class="key-btn action" onclick="limpar()">Limpar</button>
        <button type="button" class="key-btn" onclick="digitar('0')">0</button>
        <button type="button" class="key-btn action" onclick="apagar()" aria-label="Apagar dígito">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        </button>
      </div>

      <div id="bloco-categorias">
      <h2 style="font-size:18px; font-weight:700; margin-bottom:10px;">Escolha a categoria:</h2>
      <!-- Categorias com Ícones SVG -->
      <div class="cat-grid">
        <button type="button" class="cat-item active" onclick="selecionarCat(this)">
          <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px;"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span>Mercado</span>
        </button>
        <button type="button" class="cat-item" onclick="selecionarCat(this)">
          <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px;"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
          <span>Farmácia</span>
        </button>
        <button type="button" class="cat-item" onclick="selecionarCat(this)">
          <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Contas</span>
        </button>
        <button type="button" class="cat-item" onclick="selecionarCat(this)">
          <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px;"><rect x="3" y="3" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>
          <span>Transporte</span>
        </button>
        <button type="button" class="cat-item" onclick="selecionarCat(this)">
          <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Casa</span>
        </button>
        <button type="button" class="cat-item" onclick="selecionarCat(this)">
          <svg class="icon" viewBox="0 0 24 24" style="width:26px; height:26px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Outros</span>
        </button>
      </div>
      </div>

      <p id="aviso-valor" class="aviso-valor" role="status"></p>
      <button type="button" id="btn-salvar" class="btn btn-primary" onclick="salvarLancamento()">Salvar</button>
    </div>
  </div>


  <!-- Confirmação exibida na própria tela -->
  <div id="confirmacao" class="confirmacao-overlay" hidden>
    <div class="celebration-box" role="dialog" aria-modal="true" aria-labelledby="confirmacao-titulo" style="max-width:540px; width:100%;">
      <div style="width:110px; height:110px; border-radius:999px; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; margin-bottom:24px;">
        <svg style="width:64px; height:64px; stroke:white; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round;" viewBox="0 0 36 36"><path d="M6 18.5L14.5 27L30 9.5"/></svg>
      </div>

      <h1 id="confirmacao-titulo" style="font-family:var(--font-titulo); font-size:clamp(30px, 6vw, 40px); font-weight:900; margin-bottom:12px;">Tudo certo!</h1>
      <p id="confirmacao-msg" style="font-size:clamp(18px, 4.5vw, 22px); margin-bottom:32px; opacity:0.95;">Seu gasto foi anotado com sucesso.</p>

      <div style="width:100%; max-width:360px; display:flex; flex-direction:column; gap:12px;">
        <a href="inicio.html" class="btn" style="background:white; color:var(--violeta-profundo);">Ir para a tela inicial</a>
        <button type="button" id="btn-desfazer" class="btn" style="background:transparent; border-color:white; color:white;" onclick="desfazer()">Desfazer (10s)</button>
      </div>
    </div>
  </div>

  <script src="dados.js"></script>
  <script>
    let tipo = 'gasto';
    let ultimoId = null;
    function escolherTipo(novo, el) {
      tipo = novo;
      document.querySelectorAll('.tipo-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
      el.classList.add('active');
      el.setAttribute('aria-pressed', 'true');
      const entrada = tipo === 'entrada';
      document.getElementById('titulo-anotar').innerText = entrada ? 'Anotar dinheiro que entrou' : 'Anotar novo gasto';
      document.getElementById('bloco-categorias').hidden = entrada;
    }
    function salvarLancamento() {
      const valor = valorStr ? parseInt(valorStr, 10) / 100 : 0;
      if (valor <= 0) return;
      const categoria = tipo === 'entrada' ? 'Entrou dinheiro' : document.querySelector('.cat-item.active span').innerText;
      ultimoId = VeroDados.adicionar(tipo, valor, categoria);
      document.getElementById('confirmacao-msg').innerText = tipo === 'entrada'
        ? 'O dinheiro que entrou foi anotado com sucesso.'
        : 'Seu gasto foi anotado com sucesso.';
      confirmar();
    }
    let contagem;
    function confirmar() {
      let segundos = 10;
      const btn = document.getElementById('btn-desfazer');
      btn.hidden = false;
      btn.innerText = 'Desfazer (10s)';
      document.getElementById('confirmacao').hidden = false;
      clearInterval(contagem);
      contagem = setInterval(() => {
        segundos--;
        if (segundos <= 0) { clearInterval(contagem); btn.hidden = true; }
        else { btn.innerText = `Desfazer (${segundos}s)`; }
      }, 1000);
    }
    function desfazer() {
      clearInterval(contagem);
      if (ultimoId !== null) { VeroDados.remover(ultimoId); ultimoId = null; }
      document.getElementById('confirmacao').hidden = true;
    }
    let valorStr = "1250";
    function atualizar() {
      const centavos = valorStr ? parseInt(valorStr, 10) : 0;
      document.getElementById('display-valor').innerText = (centavos / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      // Valor zero ou vazio não pode ser salvo (RF08)
      document.getElementById('btn-salvar').disabled = centavos === 0;
      document.getElementById('aviso-valor').innerText = centavos === 0
        ? 'O valor está zerado. Digite quanto foi no teclado para poder salvar.'
        : '';
    }
    function digitar(d) {
      if (valorStr.length < 8) { valorStr += d; atualizar(); }
    }
    function apagar() {
      valorStr = valorStr.slice(0, -1); atualizar();
    }
    function limpar() {
      valorStr = ""; atualizar();
    }
    function selecionarCat(el) {
      document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }
    atualizar();
  </script>
  <script src="nav.js"></script>
</body>
</html>
