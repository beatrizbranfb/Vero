<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vero - Preview: Código SMS (Passo 2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
</head>
<body>

  <nav class="preview-nav-bar">
    <div class="preview-nav-links">
      <a href="index.html">Vero</a>
      <a href="login.html">Login</a>
      <a href="inicio.html">Página Inicial</a>
      <a href="anotar-gasto.html">Anotar</a>
    </div>
    <button type="button" class="menu-btn" aria-label="Abrir menu de telas" aria-expanded="false" aria-controls="menu-telas">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Menu lateral com todas as telas -->
  <div class="menu-fundo" hidden></div>
  <aside id="menu-telas" class="menu-lateral" aria-hidden="true" aria-label="Telas do aplicativo">
    <div class="menu-topo">
      <strong>Telas</strong>
      <button type="button" class="menu-fechar" aria-label="Fechar menu">
        <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="menu-links">
      <a href="index.html">Vero</a>
      <a href="login.html">Login</a>
      <a href="inicio.html">Página Inicial</a>
      <a href="anotar-gasto.html">Anotar</a>
    </div>
  </aside>

  <div class="page-container">
    <header class="navbar">
      <a href="inicio.html" class="brand-logo">
        <svg class="icon" viewBox="0 0 36 36" style="width:34px; height:34px; stroke-width:5; stroke:var(--violeta-vero);"><path d="M6 18.5L14.5 27L30 9.5"/></svg>
        <span>Vero</span>
      </a>
      <a id="sms-voltar" href="cadastro.html" class="btn-secondary navbar-btn">Voltar</a>
    </header>

    <div class="card-formulario vero-card">
      <span id="sms-passo" style="font-weight:700; color:var(--ardosia);">Passo 2 de 3</span>
      <h1 id="sms-titulo" class="titulo-tela" style="margin-top:4px;">Código de confirmação</h1>
      <p class="subtitulo-tela">Digite o código de 6 números enviado por SMS para seu celular:</p>

      <div class="campo-grupo">
        <input type="text" class="campo-input" value="000000" style="text-align:center; letter-spacing:8px; font-size:32px; font-weight:800; border-color:var(--violeta-vero);" />
      </div>

      <div style="display:flex; flex-direction:column; gap:12px; margin-top:24px;">
        <a id="sms-confirmar" href="criar-pin.html" class="btn btn-primary">Confirmar código</a>
        <a id="sms-corrigir" href="cadastro.html" class="btn btn-secondary">Corrigir número de celular</a>
      </div>
    </div>
  </div>

  <script>
    // Recuperação de senha: mesmo código SMS, levando para criar um novo PIN
    if (new URLSearchParams(location.search).has('recuperar')) {
      document.getElementById('sms-passo').innerText = 'Recuperar senha · Passo 1 de 2';
      document.getElementById('sms-titulo').innerText = 'Código para recuperar a senha';
      document.getElementById('sms-voltar').href = 'login.html';
      document.getElementById('sms-confirmar').href = 'criar-pin.html?recuperar=1';
      document.getElementById('sms-corrigir').href = 'login.html';
      document.getElementById('sms-corrigir').innerText = 'Voltar para o login';
    }
  </script>
  <script src="nav.js"></script>
</body>
</html>
