name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  detect:
    name: Detectar linguagens
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      languages: ${{ steps.check.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          langs=()
          [ -n "$(find backend -name '*.py' 2>/dev/null | head -1)" ] && langs+=('"python"')
          [ -n "$(find frontend -path '*/node_modules' -prune -o \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print 2>/dev/null | head -1)" ] && langs+=('"javascript-typescript"')
          langs+=('"actions"')
          echo "languages=[$(IFS=,; echo "${langs[*]}")]" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analisar (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
