<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vero - Início</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <style>
        body { font-family: 'Inter', sans-serif; }
        </style>
    </head>
    <body class="bg-gradient-to-br from-indigo-50 to-blue-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

        <!-- Header / Barra Superior -->
        <header class="w-full max-w-2xl mx-auto bg-white rounded-2xl shadow-md p-4 sm:p-5 flex items-center justify-between border border-gray-100">
            <div>
                <span class="text-xs uppercase tracking-wider text-indigo-500 font-bold">Bem-vindo(a)</span>
                <!-- Exibe o nome do usuário logado vindo do backend -->
                <h1 class="text-lg sm:text-xl font-bold text-gray-800">{{ usuario.noUsuario|default:"Meu Painel" }}</h1>
            </div>
            <!-- Botão de Sair -->
            <a href="{% url 'users:logout' %}" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl font-semibold text-sm hover:bg-red-100 transition flex items-center gap-2">
                🚪 Sair
            </a>
        </header>

        <!-- Conteúdo Principal -->
        <main class="w-full max-w-2xl mx-auto my-6 space-y-6">

            <!-- Card de Saldo / Resumo (Grande e Legível) -->
            <div class="bg-indigo-600 text-white rounded-3xl shadow-xl p-6 sm:p-8 relative overflow-hidden">
                <div class="absolute right-4 top-4 text-6xl opacity-10">💰</div>
                <p class="text-indigo-200 text-sm font-medium">Saldo Disponível</p>
                <h2 class="text-3xl sm:text-4xl font-extrabold mt-1">R$ 1.250,00</h2>
                <p class="text-indigo-200 text-xs mt-3">Toque no botão abaixo para ver seus extratos e gastos.</p>
            </div>

            <!-- Menu de Ações Rápidas (Botões grandes para facilitar o uso) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <!-- Botão 1: Extrato / Histórico -->
                <button class="bg-white hover:bg-indigo-50 border border-gray-100 p-5 rounded-2xl shadow-md transition flex items-center gap-4 text-left group">
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition">
                        📋
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-base">Ver Extrato</h3>
                        <p class="text-xs text-gray-500">Acompanhe suas entradas e saídas</p>
                    </div>
                </button>

                <!-- Botão 2: Ajuda / Suporte por Voz ou WhatsApp -->
                <button class="bg-white hover:bg-indigo-50 border border-gray-100 p-5 rounded-2xl shadow-md transition flex items-center gap-4 text-left group">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition">
                        💬
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-base">Ajuda / Suporte</h3>
                        <p class="text-xs text-gray-500">Tire dúvidas de forma simples</p>
                    </div>
                </button>

            </div>
        </main>

        <!-- Rodapé -->
        <footer class="w-full max-w-2xl mx-auto text-center py-4">
            <p class="text-xs text-gray-400">Vero &bull; Finanças fáceis e acessíveis</p>
        </footer>

    </body>
</html>
